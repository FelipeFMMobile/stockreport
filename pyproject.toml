[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-report"
version = "0.1.0"
description = "Dataset builder for B3 financial statements using Dados de Mercado API."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "flask>=3.0.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.2",
    "requests>=2.32.3",
    "scikit-learn>=1.5.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.2.2"]

[project.scripts]
stock-report = "stock_report.cli:main"
stock-report-prices = "stock_report.price_enrichment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
